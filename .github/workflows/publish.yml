name: Publish NuGet package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: dotnet pack PowerPlug/PowerPlug.csproj -c Release -o artifacts

      - name: Publish with NuGet trusted publishing
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        shell: bash
        run: |
          set -euo pipefail

          id_token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://www.nuget.org"
          id_token=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${id_token_url}" | jq --raw-output '.value')

          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${id_token}" \
            --header "Content-Type: application/json" \
            --data "{\"username\":\"${NUGET_USER}\",\"tokenType\":\"ApiKey\"}" \
            https://www.nuget.org/api/v2/token)
          api_key=$(jq --exit-status --raw-output '.apiKey' <<< "${response}")
          echo "::add-mask::${api_key}"

          dotnet nuget push artifacts/*.nupkg \
            --api-key "${api_key}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Publish module to PowerShell Gallery
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw "PSGALLERY_API_KEY is not configured for the release environment."
          }

          $manifest = Import-PowerShellDataFile ./dist/PowerPlug/PowerPlug.psd1
          $existing = Find-Module -Name $manifest.RootModule.Split('.')[0] -RequiredVersion $manifest.ModuleVersion -Repository PSGallery -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "PowerShell Gallery already contains version $($manifest.ModuleVersion); skipping."
            return
          }

          Publish-Module -Path ./dist/PowerPlug -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop